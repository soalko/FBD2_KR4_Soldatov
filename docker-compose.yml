services:
  # Backend сервер 1
  backend1:
    build: ./backend
    container_name: backend1
    environment:
      - PORT=3000
      - SERVER_ID=backend-1
      - SERVER_COLOR=#4CAF50  # Зелёный
    networks:
      - lb-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Backend сервер 2
  backend2:
    build: ./backend
    container_name: backend2
    environment:
      - PORT=3000
      - SERVER_ID=backend-2
      - SERVER_COLOR=#2196F3  # Синий
    networks:
      - lb-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Backend сервер 3 (резервный)
  backend3:
    build: ./backend
    container_name: backend3
    environment:
      - PORT=3000
      - SERVER_ID=backend-3-backup
      - SERVER_COLOR=#FF9800  # Оранжевый
    networks:
      - lb-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Nginx балансировщик
  nginx:
    image: nginx:alpine
    container_name: nginx-lb
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - backend1
      - backend2
      - backend3
    networks:
      - lb-network
    restart: unless-stopped

# Сети
networks:
  lb-network:
    driver: bridge
    name: load-balancing-network

# Тома для хранения логов
volumes:
  nginx-logs:
    name: nginx-logs-volume